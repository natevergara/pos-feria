<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Cece Calc</title>

<!-- PWA · 100% offline (sin CDNs, sin fuentes remotas) -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Cece Calc"/>
<meta name="format-detection" content="telephone=no"/>
<link rel="icon" href="icons/cece-192.png" sizes="192x192" type="image/png"/>
<link rel="apple-touch-icon" href="icons/cece-192.png"/>

<!-- Tailwind compilado localmente (antes: cdn.tailwindcss.com) -->
<link rel="stylesheet" href="style.css"/>
  </head>
<body>
<div class="app">
<!-- Encabezado compacto: prendas + total -->
<header class="display">
<div class="total-row">
<span class="pieces" id="items-badge">0 prendas</span>
<div class="total">
<span class="total-cur">$</span><span class="total-num" id="display-total">0</span>
</div>
</div>
</header>

<main class="pad">
<div class="pad-stage">
<section aria-label="Catálogo Rápido" class="products" id="product-grid">
<button class="key key-product" onclick="handleProductTap('Soie', 60)">
<span class="count hidden" id="count-Soie">0</span>
<span class="name">Soie</span>
<span class="price">$60</span>
</button>
<button class="key key-product" onclick="handleProductTap('Venus', 60)">
<span class="count hidden" id="count-Venus">0</span>
<span class="name">Venus</span>
<span class="price">$60</span>
</button>
<button class="key key-product" onclick="handleProductTap('Paris', 65)">
<span class="count hidden" id="count-Paris">0</span>
<span class="name">Paris</span>
<span class="price">$65</span>
</button>
<button class="key key-product" onclick="handleProductTap('Yan', 65)">
<span class="count hidden" id="count-Yan">0</span>
<span class="name">Yan</span>
<span class="price">$65</span>
</button>
<button class="key key-product" onclick="handleProductTap('Channel', 60)">
<span class="count hidden" id="count-Channel">0</span>
<span class="name">Channel</span>
<span class="price">$60</span>
</button>
<button class="key key-product" onclick="handleProductTap('Moly', 75)">
<span class="count hidden" id="count-Moly">0</span>
<span class="name">Moly</span>
<span class="price">$75</span>
</button>
</section>


<!-- Teclado numérico (superpuesto) -->
<section aria-label="Teclado Numérico para Anotar Pago" class="keypad" hidden id="keypad-container">
<button class="key key-num" onclick="handleKeypadDigit(1)">1</button>
<button class="key key-num" onclick="handleKeypadDigit(2)">2</button>
<button class="key key-num" onclick="handleKeypadDigit(3)">3</button>
<button class="key key-num" onclick="handleKeypadDigit(4)">4</button>
<button class="key key-num" onclick="handleKeypadDigit(5)">5</button>
<button class="key key-num" onclick="handleKeypadDigit(6)">6</button>
<button class="key key-num" onclick="handleKeypadDigit(7)">7</button>
<button class="key key-num" onclick="handleKeypadDigit(8)">8</button>
<button class="key key-num" onclick="handleKeypadDigit(9)">9</button>
<button class="key key-fn" onclick="handleKeypadClear()">C</button>
<button class="key key-num" onclick="handleKeypadDigit(0)">0</button>
<button class="key key-accent" onclick="toggleKeypad()">Listo</button>
</section>
</div>

<section class="settle" aria-label="Pago y vuelto">
<div aria-label="Tocar para anotar pago recibido" class="settle-cell settle-tap" id="recibido-container" onclick="toggleKeypad()" role="button" tabindex="0">
<span class="settle-lbl">Recibido</span>
<span class="settle-val"><span class="settle-cur">$</span><span id="display-tendered">0</span></span>
</div>
<div class="settle-cell" id="vuelto-container">
<span class="settle-lbl" id="vuelto-label">Vuelto</span>
<span class="settle-val"><span class="settle-cur" id="vuelto-currency">$</span><span id="display-change">0</span></span>
</div>
</section>

<footer class="actions">
<button class="key key-fn" onclick="handleUndo()" title="Deshacer último artículo">Deshacer</button>
<button class="key key-accent grow" id="btn-complete" onclick="handleResetSale()">Nuevo cliente</button>
</footer>
</main>
</div>

<script src="app.js"></script>
<script>
  /* PWA: registro del Service Worker (cache-first / modo avión) */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function (err) {
        console.warn('SW no registrado:', err);
      });
    });
  })();
</script>
</body></html>
